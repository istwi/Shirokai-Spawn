name: Build and publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.1.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Publish JARs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" *.jar SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
